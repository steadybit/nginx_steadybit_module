# Throwaway test, do not merge: CLA check with a GitHub App token instead of a personal token.
name: "CLA app token test"
on:
  pull_request:
    paths:
      - .github/workflows/cla-app-token-test.yml

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  call-workflow:
    uses: steadybit/.github/.github/workflows/cla.yml@test/cla-app-token
    with:
      app-id: ${{ vars.GH_APP_STEADYBIT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.GH_APP_STEADYBIT_PRIVATE_KEY }}
